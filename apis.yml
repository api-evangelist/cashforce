name: Cashforce
description: >-
  Cashforce is a fintech platform focused on cash flow forecasting and
  working-capital analytics for corporate treasury and finance teams, connecting
  ERP systems, bank accounts, and financial data to give companies real-time
  visibility into cash positions, liquidity, and forecasting scenarios. Originally
  a Techstars-backed portfolio company, Cashforce was acquired by Billtrust and its
  standalone product surface is no longer independently operated; this API Evangelist
  profile tracks the company's public footprint. No public developer portal, API
  documentation, or machine-readable API definitions are currently reachable at the
  cashforce.com origin (the site returns HTTP 522), so this record carries identity
  and domain-security signals only.
